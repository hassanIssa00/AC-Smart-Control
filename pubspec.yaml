name: ac_smart_control
description: Smart AC Control System via Bluetooth + ESP32
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  provider: ^6.1.2
  animated_text_kit: ^4.2.3
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_blue_classic: ^0.1.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
